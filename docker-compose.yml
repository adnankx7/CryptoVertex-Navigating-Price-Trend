version: '3.8'

services:
  backend:
    build: ./backend
    container_name: cryptovertex-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./secure_data:/app/secure_data
    environment:
      - SECRET_KEY=dev_secret_key
      - LOG_LEVEL=INFO
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cryptovertex-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    border:
      - backend
    restart: unless-stopped
